<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radios Antojo Verde</title>

<link rel="icon" type="image/png" href="icono.png">
<meta name="theme-color" content="#0f1720">

<style>
body{
    margin:0;
    font-family:sans-serif;
    background: linear-gradient(180deg,#0f1720,#0b1a0f);
    color:white;
    text-align:center;
    padding-bottom:100px;
}

h2{
    color:#4ade80;
    margin-top:25px;
}

.radio-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    max-width:550px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(8px);
    border-radius:22px;
    padding:25px 10px;
    cursor:pointer;
    transition: all 0.25s ease;
    border:1px solid rgba(255,255,255,0.08);
    min-width:0;
}

.card:hover{
    transform:scale(1.05);
}

.card.active{
    background:#4ade80;
    color:black;
    box-shadow:0 0 20px #4ade80;
}

.card span{
    font-size:30px;
    display:block;
    margin-bottom:10px;
}

.card p{
    margin:0;
    font-weight:bold;
    font-size:0.85em;
}

/* Barra inferior */
.player-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111827;
    border-top:1px solid #1f2937;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-sizing:border-box;
}

.player-info{
    text-align:left;
    font-size:0.9em;
    color:#9ae6b4;
}

.play-btn{
    background:#4ade80;
    border:none;
    padding:10px 18px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
}

audio{
    display:none;
}
  <style>
.logo{
    width:48px;
    height:48px;
    object-fit:contain;
    margin-bottom:10px;
}
.radio-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    width:100%;
    padding:0 10px;
    box-sizing:border-box;
}
    html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}
</style>  
</style>
</head>

<body>

<h2>🌿 Radios Antojo Verde</h2>
<p>Elegí una radio</p>

<div class="radio-grid">

<div class="card" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/AM790_56_SC.mp3', this, 'Radio Mitre')">
    <img src="logo/mitre.png" class="logo">
    <p>Radio Mitre</p>
</div>

<div class="card" onclick="playRadio('https://24373.live.streamtheworld.com/ASPEN.mp3', this, 'Aspen 102.3')">
    <img src="logo/aspen.png" class="logo">
    <p>Aspen 102.3</p>
</div>

<div class="card"onclick="playRadio('https://das-edge63-live365-dal03.cdnstream.com/a98981', this, 'La Nación 104.9')">
    <img src="logo/lanacion.png" class="logo">
    <p>La Nación 104.9</p>
</div>

<div class="card" onclick="playRadio('https://24403.live.streamtheworld.com/FM999_56.mp3', this, 'La 100')">
    <img src="logo/la100.png" class="logo">
    <p>La 100</p>
</div>

<div class="card" onclick="playRadio('https://vale.stweb.tv/vale/live/chunks.m3u8?', this, 'Vale 97.5')">
    <img src="logo/vale.png" class="logo">
    <p>Vale 97.5</p>
</div>

<div class="card" onclick="playRadio('https://27443.live.streamtheworld.com/ROCKANDPOPAAC.aac', this, 'Rock & Pop')">
    <img src="logo/rockpop.png" class="logo">
    <p>Rock & Pop</p>
</div>

<div class="card" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/DISNEY_ARG_BA.mp3', this, 'Radio Disney')">
    <img src="logo/disney.png" class="logo">
    <p>Radio Disney</p>
</div>

<div class="card" onclick="playRadio('https://cdn.instream.audio:9660/stream', this, 'Urbana Play')">
    <img src="logo/urbana.png" class="logo">
    <p>Urbana Play</p>
</div>

<div class="card" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/RIVADAVIA.mp3', this, 'Radio Rivadavia')">
    <img src="logo/rivadavia.png" class="logo">
    <p>Radio Rivadavia</p>
</div>

<div class="card" onclick="playRadio('https://unlimited5-us.dps.live/observador/aac/icecast.audio', this, 'EO 107.9')">
    <img src="logo/eo.png" class="logo">
    <p>EO 107.9</p>
</div>

</div>

<div class="player-bar">
    <div class="player-info" id="nowPlaying">
        🎵 Ninguna radio sonando
    </div>
    <button class="play-btn" onclick="togglePlay()">Play</button>
</div>

<audio id="player" preload="none"></audio>

<script>
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");
const playBtn = document.querySelector(".play-btn");
let activeCard = null;

function playRadio(url, card, name){
    player.src = url;
    player.play();

    nowPlaying.textContent = "🎵 Sonando: " + name;
    playBtn.textContent = "Pause";

    if(activeCard){
        activeCard.classList.remove("active");
    }

    card.classList.add("active");
    activeCard = card;
}

function togglePlay(){
    if(player.paused){
        player.play();
        playBtn.textContent = "Pause";
    }else{
        player.pause();
        playBtn.textContent = "Play";
    }
}
</script>

</body>
</html>
