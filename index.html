<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radios Antojo Verde</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f1f16;
color:white;
text-align:center;
padding-bottom:120px;
}

h1{
margin-top:20px;
color:#4ade80;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.tab{
background:#162a1c;
border:none;
padding:10px 18px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
}

.tab.active{
background:#4ade80;
color:black;
}

.radio-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
padding:20px;
max-width:650px;
margin:auto;
}

.card{
background:#162a1c;
border-radius:15px;
padding:15px;
cursor:pointer;
transition:0.2s;
border:2px solid transparent;
}

.card img{
width:70px;
height:70px;
object-fit:contain;
margin-bottom:10px;
}

.card p{
margin:0;
font-weight:bold;
font-size:14px;
}

.card:hover{
transform:scale(1.05);
}

.card.active{
border:2px solid #4ade80;
box-shadow:0 0 15px #4ade80;
background:#1f3b2a;
}

.player-bar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
padding:15px;
border-top:1px solid #333;
}

#currentRadioName{
margin-bottom:10px;
font-weight:bold;
color:#4ade80;
}

audio{
width:90%;
max-width:400px;
}

.floating-player{
position:fixed;
bottom:90px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:#4ade80;
color:black;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 15px #4ade80;
}

.volume{
margin-top:8px;
}

.card:focus,
.tab:focus,
#playButton:focus{
outline:3px solid #4ade80;
transform:scale(1.05);
}

</style>
</head>

<body>

<h1>🌿 Radios Antojo Verde </h1>

<div class="tabs">
<button id="tabRadios" class="tab active">📻 RADIOS</button>
<button id="tabComercios" class="tab">🛒 COMERCIOS</button>
</div>

<!-- RADIOS (NO TOCADO) -->
<div id="radiosSection">
<div class="radio-grid">

<!-- (TODO TU BLOQUE DE RADIOS IGUAL, NO LO TOQUÉ) -->
<!-- 👉 ACÁ VA EXACTAMENTE TODO LO QUE YA TENÍAS -->
</div>
</div>

<!-- 🛒 COMERCIOS (REEMPLAZA NOTICIAS) -->
<div id="comerciosSection" style="display:none">
<h2>🛒 Comercios y Servicios</h2>

<div class="radio-grid">

<div class="card" onclick="mostrarCategoria('ferreterias')">
<p>🔧 Ferreterías</p>
</div>

<div class="card" onclick="mostrarCategoria('verdulerias')">
<p>🥬 Verdulerías</p>
</div>

<div class="card" onclick="mostrarCategoria('pinturerias')">
<p>🎨 Pinturerías</p>
</div>

<div class="card" onclick="mostrarCategoria('electricistas')">
<p>⚡ Electricistas</p>
</div>

</div>

<!-- LISTAS -->

<div id="ferreterias" style="display:none; padding:15px;">
<h3>🔧 Ferreterías</h3>

<div class="card">
<p>Ferretería Ejemplo</p>
<a href="https://wa.me/5490000000000" target="_blank">📲 WhatsApp</a>
</div>

</div>

<div id="verdulerias" style="display:none; padding:15px;">
<h3>🥬 Verdulerías</h3>
</div>

<div id="pinturerias" style="display:none; padding:15px;">
<h3>🎨 Pinturerías</h3>
</div>

<div id="electricistas" style="display:none; padding:15px;">
<h3>⚡ Electricistas</h3>
</div>

</div>

<div class="player-bar">
<div id="currentRadioName">Seleccioná una radio</div>
<audio id="audioPlayer" controls></audio>

<div class="volume">
Volumen  
<input type="range" id="volume" min="0" max="1" step="0.01" value="1">
</div>
</div>

<div class="floating-player" id="playButton">▶</div>

<script>

if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("service-worker.js")
}

const cards=document.querySelectorAll(".card")
const audio=document.getElementById("audioPlayer")
const nameBox=document.getElementById("currentRadioName")
const playButton=document.getElementById("playButton")
const volume=document.getElementById("volume")

volume.addEventListener("input",()=>{
audio.volume=volume.value
})

cards.forEach(card=>{
if(!card.dataset.stream) return

card.addEventListener("click",()=>{
cards.forEach(c=>c.classList.remove("active"))
card.classList.add("active")

audio.src=card.dataset.stream
audio.play()
nameBox.textContent="Reproduciendo: "+card.dataset.name
})
})

playButton.addEventListener("click",()=>{
if(audio.paused){
audio.play()
playButton.textContent="⏸"
}else{
audio.pause()
playButton.textContent="▶"
}
})

const tabRadios=document.getElementById("tabRadios")
const tabComercios=document.getElementById("tabComercios")

const radiosSection=document.getElementById("radiosSection")
const comerciosSection=document.getElementById("comerciosSection")

tabRadios.onclick=()=>{
radiosSection.style.display="block"
comerciosSection.style.display="none"
tabRadios.classList.add("active")
tabComercios.classList.remove("active")
document.querySelector(".player-bar").style.display="block"
}

tabComercios.onclick=()=>{
radiosSection.style.display="none"
comerciosSection.style.display="block"
tabComercios.classList.add("active")
tabRadios.classList.remove("active")
document.querySelector(".player-bar").style.display="none"
}

function mostrarCategoria(cat){
["ferreterias","verdulerias","pinturerias","electricistas"].forEach(id=>{
const el=document.getElementById(id)
if(el) el.style.display="none"
})

const activa=document.getElementById(cat)
if(activa) activa.style.display="block"
}

document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
document.activeElement.click()
}
})

</script>

</body>
</html>
