<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Radio App + Comercios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
    }

    header {
      background: #1f1f1f;
      padding: 10px;
      text-align: center;
    }

    .menu {
      display: flex;
      justify-content: space-around;
      background: #222;
      padding: 10px;
    }

    .menu button {
      background: #333;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      flex: 1;
      margin: 0 5px;
    }

    .menu button:hover {
      background: #555;
    }

    .seccion {
      display: none;
      padding: 15px;
    }

    .activa {
      display: block;
    }

    .radio-btn {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .radio-btn:hover {
      background: #555;
    }

    .grid-botones {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h2>📻 Mi Radio App</h2>
</header>

<div class="menu">
  <button onclick="mostrarSeccion('radios')">Radios</button>
  <button onclick="mostrarSeccion('comercios')">Comercios</button>
</div>

<!-- 📻 RADIOS -->
<div id="radios" class="seccion activa">

  <h3>🎧 Radios en vivo</h3>

  <button class="radio-btn" onclick="reproducir('https://stream.laradio.com.ar/stream')">
    Radio 1
  </button>

  <button class="radio-btn" onclick="reproducir('https://stream2.laradio.com.ar/stream')">
    Radio 2
  </button>

  <button class="radio-btn" onclick="reproducir('https://stream3.laradio.com.ar/stream')">
    Radio 3
  </button>

  <audio id="player" controls></audio>

</div>

<!-- 🛒 COMERCIOS -->
<div id="comercios" class="seccion">

  <h3>🛒 Comercios y Servicios</h3>

  <div class="grid-botones">

    <button class="radio-btn" onclick="mostrarCategoria('ferreterias')">
      🔧 Ferreterías
    </button>

    <button class="radio-btn" onclick="mostrarCategoria('verdulerias')">
      🥬 Verdulerías
    </button>

    <button class="radio-btn" onclick="mostrarCategoria('pinturerias')">
      🎨 Pinturerías
    </button>

    <button class="radio-btn" onclick="mostrarCategoria('electricistas')">
      ⚡ Electricistas
    </button>

  </div>

  <!-- LISTA FERRETERÍAS -->
  <div id="ferreterias" style="display:none; margin-top:15px;">

    <h4>🔧 Ferreterías</h4>

    <button class="radio-btn">
      Ferretería El Gallego<br>
      📍 Dirección ejemplo<br>
      <a href="https://wa.me/5490000000000" target="_blank">📲 WhatsApp</a>
    </button>

  </div>

  <!-- LISTA VERDULERÍAS -->
  <div id="verdulerias" style="display:none; margin-top:15px;">

    <h4>🥬 Verdulerías</h4>

    <button class="radio-btn">
      Verdulería La Huerta<br>
      📍 Dirección ejemplo<br>
      <a href="https://wa.me/5490000000000" target="_blank">📲 WhatsApp</a>
    </button>

  </div>

  <!-- LISTA PINTURERÍAS -->
  <div id="pinturerias" style="display:none; margin-top:15px;">

    <h4>🎨 Pinturerías</h4>

    <button class="radio-btn">
      Pinturería ColorMix<br>
      📍 Dirección ejemplo<br>
      <a href="https://wa.me/5490000000000" target="_blank">📲 WhatsApp</a>
    </button>

  </div>

  <!-- LISTA ELECTRICISTAS -->
  <div id="electricistas" style="display:none; margin-top:15px;">

    <h4>⚡ Electricistas</h4>

    <button class="radio-btn">
      Juan Electricista<br>
      📍 Servicio a domicilio<br>
      <a href="https://wa.me/5490000000000" target="_blank">📲 WhatsApp</a>
    </button>

  </div>

</div>

<script>
  function mostrarSeccion(seccion) {
    document.querySelectorAll('.seccion').forEach(div => {
      div.classList.remove('activa');
    });

    document.getElementById(seccion).classList.add('activa');
  }

  function reproducir(url) {
    const player = document.getElementById('player');
    player.src = url;
    player.play();
  }

  function mostrarCategoria(cat) {
    const categorias = ['ferreterias','verdulerias','pinturerias','electricistas'];

    categorias.forEach(c => {
      document.getElementById(c).style.display = 'none';
    });

    document.getElementById(cat).style.display = 'block';
  }
</script>

</body>
</html>
