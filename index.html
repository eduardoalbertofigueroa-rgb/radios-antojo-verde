
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Radios Antojo Verde</title>

    <!-- ICONO -->
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" href="icono.png">
    <meta name="theme-color" content="#0b1a0f">

    <style>
        body {
            font-family: sans-serif;
            background: #0b1a0f;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h2 { color:#4ade80; }

        .btn {
            display: block;
            background: #162a1c;
            color: #4ade80;
            padding: 30px;
            margin: 12px auto;
            border-radius: 18px;
            font-weight: bold;
            border: 2px solid #2d4a35;
            max-width: 320px;
            cursor: pointer;
            font-size: 1.1em;
        }

        .btn:active {
            background: #4ade80;
            color: black;
        }

        .btn.active {
            background: #4ade80;
            color: black;
            box-shadow: 0 0 15px #4ade80;
        }

        audio {
            width: 100%;
            max-width: 340px;
            margin: 25px auto;
        }

        .social {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 30px;
        }

        .social a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<h2>🌿 Radios Antojo Verde</h2>
<p>Tocá una radio y se reproduce sola</p>

<p id="nowPlaying" style="color:#9ae6b4; font-weight:bold; margin-bottom:20px;">
    🎵 Ninguna radio sonando
</p>

<audio id="player" controls preload="none"></audio>

    📻 La Nación 104.9
</div>
    
<div class="btn" onclick="playRadio('https://24403.live.streamtheworld.com/FM999_56.mp3', this, 'La 100')">📻 La 100

<div class="social">
    <a href="https://instagram.com/antojoverdeok" target="_blank">📸</a>
    <a href="https://wa.me/c/5492364581705" target="_blank">💬</a>
</div>

<p style="font-size:0.8em; color:#666; margin-top:30px">
    Reproducción directa · sin apps · sin vueltas
</p>

<script>
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");
let activeButton = null;

function playRadio(url, btn, name) {
    player.src = url;
    player.play();

    nowPlaying.textContent = "🎵 Sonando ahora: " + name;

    if (activeButton) {
        activeButton.classList.remove("active");
    }

    btn.classList.add("active");
    activeButton = btn;
}
</script>

</body>
