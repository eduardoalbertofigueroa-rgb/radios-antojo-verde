
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radios Antojo Verde</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
}

h1{
    text-align:center;
    padding:15px;
}

.radio-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
    padding:15px;
    box-sizing:border-box;
}

.card{
    background:#1c1c1c;
    border-radius:12px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
    border:2px solid transparent;
}

.card img{
    width:100%;
    height:100px;
    object-fit:contain;
}

.card p{
    margin:8px 0 0 0;
    font-size:14px;
}

.card:hover{
    transform:scale(1.05);
}

.card.active{
    border:2px solid #00ff88;
    box-shadow:0 0 10px #00ff88;
}

.player-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#000;
    padding:10px;
    text-align:center;
    border-top:1px solid #333;
}

audio{
    width:90%;
    max-width:400px;
}
</style>
</head>

<body>

<h1>Radios Antojo Verde</h1>

<div class="radio-grid">

<div class="card" data-stream="https://stream-ssl.zeno.fm/0r0xa792kwzuv" data-name="Radio Uno">
<img src="https://via.placeholder.com/150?text=Radio+1">
<p>Radio Uno</p>
</div>

<div class="card" data-stream="https://stream-ssl.zeno.fm/8g5u7k5tpwzuv" data-name="Radio Dos">
<img src="https://via.placeholder.com/150?text=Radio+2">
<p>Radio Dos</p>
</div>

<div class="card" data-stream="https://stream-ssl.zeno.fm/4mbf6p8sxwzuv" data-name="Radio Tres">
<img src="https://via.placeholder.com/150?text=Radio+3">
<p>Radio Tres</p>
</div>

</div>

<div class="player-bar">
<p id="currentRadioName">Seleccioná una radio</p>
<audio id="audioPlayer" controls></audio>
</div>

<script>
const radios = document.querySelectorAll(".card");
const audio = document.getElementById("audioPlayer");
const currentRadioName = document.getElementById("currentRadioName");

let currentStream = null;

window.addEventListener("load", () => {
  const lastRadio = localStorage.getItem("lastRadio");
  const lastName = localStorage.getItem("lastRadioName");

  if (lastRadio && lastName) {
    currentStream = lastRadio;
    audio.src = lastRadio;
    currentRadioName.textContent = "Lista: " + lastName;

    radios.forEach(r => {
      if (r.dataset.stream === lastRadio) {
        r.classList.add("active");
      }
    });
  }
});

radios.forEach(radio => {
  radio.addEventListener("click", () => {

    radios.forEach(r => r.classList.remove("active"));
    radio.classList.add("active");

    const stream = radio.dataset.stream;
    const name = radio.dataset.name;

    if (currentStream === stream) {
      audio.pause();
      audio.src = "";
      currentStream = null;
      currentRadioName.textContent = "Radio detenida";
      localStorage.removeItem("lastRadio");
      localStorage.removeItem("lastRadioName");
    } else {
      currentStream = stream;
      audio.src = stream;
      audio.play();
      currentRadioName.textContent = "Reproduciendo: " + name;

      localStorage.setItem("lastRadio", stream);
      localStorage.setItem("lastRadioName", name);
    }
  });
});
</script>

</body>
</html>
