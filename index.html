
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radios Antojo Verde</title>

<link rel="icon" href="icon.png">
<meta name="theme-color" content="#0b1a0f">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:sans-serif;
    background:#0b1a0f;
    color:white;
}

body{
    text-align:center;
    padding-bottom:90px;
}

h2{
    color:#4ade80;
    margin-top:25px;
}

.radio-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
    padding:20px;
    max-width:420px;
    margin:0 auto;
}

.card{
    background:#162a1c;
    border-radius:18px;
    padding:18px 10px;
    border:1px solid #2d4a35;
    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.card:active{
    background:#4ade80;
    color:black;
}

.logo{
    width:50px;
    height:50px;
    object-fit:contain;
    margin-bottom:8px;
}

.card p{
    margin:0;
    font-size:13px;
    font-weight:bold;
}

.player-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.play-btn{
    background:#4ade80;
    border:none;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>🌿 Radios Antojo Verde</h2>
<p>Elegí una radio</p>

<div class="radio-grid">

<div class="card" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/AM790_56_SC.mp3')">
<img src="logo/mitre.png" class="logo">
<p>Radio Mitre</p>
</div>

<div class="card" onclick="playRadio('https://24373.live.streamtheworld.com/ASPEN.mp3')">
<img src="logo/aspen.png" class="logo">
<p>Aspen 102.3</p>
</div>

<div class="card" onclick="playRadio('https://das-edge63-live365-dal03.cdnstream.com/a98981')">
<img src="logo/lanacion.png" class="logo">
<p>La Nación 104.9</p>
</div>

<div class="card" onclick="playRadio('https://cdn.instream.audio:9660/stream')">
<img src="logo/urbana.png" class="logo">
<p>Urbana Play</p>
</div>

<div class="card" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/DISNEY_ARG_BA.mp3')">
<img src="logo/disney.png" class="logo">
<p>Radio Disney</p>
</div>

<div class="card" onclick="playRadio('https://24283.live.streamtheworld.com/RIVADAVIA.mp3')">
<img src="logo/rivadavia.png" class="logo">
<p>Radio Rivadavia</p>
</div>

</div>

<div class="player-bar">
<span id="status">🎵 Ninguna radio</span>
<button class="play-btn" onclick="togglePlay()">Play</button>
</div>

<audio id="player"></audio>

<script>
const player=document.getElementById("player");
const status=document.getElementById("status");
const playBtn=document.querySelector(".play-btn");

function playRadio(url){
    player.src=url;
    player.play();
    status.textContent="🎵 Reproduciendo...";
    playBtn.textContent="Pause";
}

function togglePlay(){
    if(player.paused){
        player.play();
        playBtn.textContent="Pause";
    }else{
        player.pause();
        playBtn.textContent="Play";
    }
}
</script>

</body>
</html>
