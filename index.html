<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radios Antojo Verde</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f1f16;
    color:white;
    text-align:center;
    padding-bottom:110px;
}

h1{
    margin-top:20px;
    color:#4ade80;
}

.radio-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    padding:20px;
    max-width:600px;
    margin:auto;
}

.card{
    background:#162a1c;
    border-radius:15px;
    padding:15px;
    cursor:pointer;
    transition:0.2s;
    border:2px solid transparent;
}

.card img{
    width:70px;
    height:70px;
    object-fit:contain;
    margin-bottom:10px;
}

.card p{
    margin:0;
    font-weight:bold;
    font-size:14px;
}

.card:hover{
    transform:scale(1.05);
}

.card.active{
    border:2px solid #4ade80;
    box-shadow:0 0 15px #4ade80;
    background:#1f3b2a;
}

.player-bar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    padding:15px;
    border-top:1px solid #333;
}

#currentRadioName{
    margin-bottom:10px;
    font-weight:bold;
    color:#4ade80;
}

audio{
    width:90%;
    max-width:400px;
}
</style>
</head>

<body>

<h1>🌿 Radios Antojo Verde</h1>

<div class="radio-grid">

<div class="card" data-name="Radio Mitre"
data-stream="https://playerservices.streamtheworld.com/api/livestream-redirect/AM790_56_SC.mp3">
<img src="logo/mitre.png">
<p>Radio Mitre</p>
</div>

<div class="card" data-name="Aspen 102.3"
data-stream="https://24373.live.streamtheworld.com/ASPEN.mp3">
<img src="logo/aspen.png">
<p>Aspen 102.3</p>
</div>

<div class="card" data-name="La Nación 104.9"
data-stream="https://das-edge63-live365-dal03.cdnstream.com/a98981">
<img src="logo/lanacion.png">
<p>La Nación 104.9</p>
</div>

<div class="card" data-name="La 100"
data-stream="https://27383.live.streamtheworld.com/FM999_56.mp3">
<img src="logo/la100.png">
<p>La 100</p>
</div>

<div class="card" data-name="Vale 97.5"
data-stream="https://vale.stweb.tv/vale/live/chunks.m3u8">
<img src="logo/vale.png">
<p>Vale 97.5</p>
</div>

<div class="card" data-name="Rock & Pop"
data-stream="https://27443.live.streamtheworld.com/ROCKANDPOPAAC.aac">
<img src="logo/rockpop.png">
<p>Rock & Pop</p>
</div>

<div class="card" data-name="Radio Disney"
data-stream="https://playerservices.streamtheworld.com/api/livestream-redirect/DISNEY_ARG_BA.mp3">
<img src="logo/disney.png">
<p>Radio Disney</p>
</div>

<div class="card" data-name="Urbana Play"
data-stream="https://cdn.instream.audio:9660/stream">
<img src="logo/urbana.png">
<p>Urbana Play</p>
</div>

<div class="card" data-name="Radio Rivadavia"
data-stream="https://playerservices.streamtheworld.com/api/livestream-redirect/RIVADAVIA.mp3">
<img src="logo/rivadavia.png">
<p>Radio Rivadavia</p>
</div>

<div class="card" data-name="EO 107.9"
data-stream="https://unlimited5-us.dps.live/observador/aac/icecast.audio">
<img src="logo/eo.png">
<p>EO 107.9</p>
</div>

</div>

<div class="player-bar">
<div id="currentRadioName">Seleccioná una radio</div>
<audio id="audioPlayer" controls></audio>
</div>

<script>
const cards = document.querySelectorAll(".card");
const audio = document.getElementById("audioPlayer");
const currentRadioName = document.getElementById("currentRadioName");

let currentStream = null;

window.addEventListener("load", () => {
    const lastStream = localStorage.getItem("lastStream");
    const lastName = localStorage.getItem("lastName");

    if(lastStream && lastName){
        audio.src = lastStream;
        currentStream = lastStream;
        currentRadioName.textContent = "Lista: " + lastName;

        cards.forEach(card => {
            if(card.dataset.stream === lastStream){
                card.classList.add("active");
            }
        });
    }
});

cards.forEach(card => {
    card.addEventListener("click", () => {

        cards.forEach(c => c.classList.remove("active"));
        card.classList.add("active");

        const stream = card.dataset.stream;
        const name = card.dataset.name;

        if(currentStream === stream){
            audio.pause();
            audio.src = "";
            currentStream = null;
            currentRadioName.textContent = "Radio detenida";
            localStorage.removeItem("lastStream");
            localStorage.removeItem("lastName");
            card.classList.remove("active");
        } else {
            audio.src = stream;
            audio.play();
            currentStream = stream;
            currentRadioName.textContent = "Reproduciendo: " + name;

            localStorage.setItem("lastStream", stream);
            localStorage.setItem("lastName", name);
        }
    });
});
</script>

</body>
</html>
