<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio en TV</title>

<style>

body{
background:#000;
color:white;
font-family:Arial;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
text-align:center;
}

.logo{
width:150px;
margin-bottom:20px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.08)}
100%{transform:scale(1)}
}

h1{
color:#4ade80;
font-size:28px;
}

audio{
margin-top:20px;
width:350px;
}

</style>

</head>

<body>

<img src="logo/radio.png" class="logo">

<h1 id="radioName">Cargando radio...</h1>

<audio id="player" controls autoplay></audio>

<script>

const params = new URLSearchParams(window.location.search)

const stream = params.get("stream")
const name = params.get("name")

const player = document.getElementById("player")

document.getElementById("radioName").textContent = name || "Radio en vivo"

if(stream){
player.src = stream
player.play().catch(()=>{})
}

</script>

</body>
</html>
