<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios Antojo Verde</title>

    <!-- ICONO -->
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" href="icono.png">
    <meta name="theme-color" content="#0b1a0f">

    <style>
        body {
            font-family: sans-serif;
            background: #0b1a0f;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h2 { color:#4ade80; }

        .btn {
            display: block;
            background: #162a1c;
            color: #4ade80;
            padding: 25px;
            margin: 10px auto;
            border-radius: 15px;
            font-weight: bold;
            border: 2px solid #2d4a35;
            max-width: 300px;
            cursor: pointer;
        }

        .btn:active {
            background: #4ade80;
            color: black;
        }

        audio {
            width: 100%;
            max-width: 320px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

<h2>🌿 Radios Antojo Verde</h2>
<p>Tocá una radio y después ▶ Play</p>

<audio id="player" controls preload="none">
    <source id="source" src="" type="audio/mpeg">
    Tu navegador no soporta audio en vivo.
</audio>

<div class="btn" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/AM790_56_SC.mp3')">
    📻 Radio Mitre
</div>

<div class="btn" onclick="playRadio('https://24373.live.streamtheworld.com/ASPEN.mp3')">
    📻 Aspen 102.3
</div>

<div class="btn" onclick="playRadio('https://das-edge63-live365-dal03.cdnstream.com/a98981')">
    📻 La Nación 104.9
</div>

<div class="btn" onclick="playRadio('https://cdn.instream.audio:9660/stream')">
    📻 Urbana Play
</div>

<div class="btn" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/DISNEY_ARG_BA.mp3')">
    📻 Radio Disney
</div>

<div class="btn" onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/RIVADAVIA.mp3')">
    📻 Radio Rivadavia AM630
</div>

<p style="font-size:0.8em; color:#666; margin-top:40px">
    Reproducción directa · sin abrir apps · sin descargas
</p>

<script>
function playRadio(url) {
    const player = document.getElementById("player");
    const source = document.getElementById("source");

    source.src = url;
    player.load();
    player.play();
}
</script>

</body>
</html>
